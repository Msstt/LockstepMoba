syntax = "proto3";

package Network;

// 战斗开始
message battle_start_s2c {
  message player_info {
    int32 uid = 1;
    int32 champion_id = 2; // 英雄
    int32 camp = 3; // 阵营
    repeated int32 skill = 4; // 召唤师技能
  }
  
  int32 self_uid = 1;
  repeated player_info players = 2;
}

// 选择英雄
message select_champion_c2s {
  int32 champion_id = 1;
}

message select_champion_s2c {
  int32 champion_id = 1;
}
